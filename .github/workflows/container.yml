name: Test and publish BossDB nuclei container

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - name: Build image with baked model
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --load \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE" .
      - name: Run unit tests
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          docker run --rm --entrypoint python -e PYTHONPATH=/opt/bossdb-nuclei \
            -v "$PWD/tests:/tests:ro" "$IMAGE" \
            -m unittest discover -s /tests -v
      - name: Publish this commit's image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
